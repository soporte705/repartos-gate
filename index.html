<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8202c">
<meta name="robots" content="noindex, nofollow">
<title>EMAPI · Repartos</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1f1f1f;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }
  .gate {
    background: #fff; border-radius: 16px; padding: 32px 28px;
    max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
    border: 1px solid #e0e0e0;
  }
  .brand-mark {
    display: inline-block; background: #c8202c; color: #fff;
    font-size: 14px; font-weight: 700; letter-spacing: 1.2px;
    padding: 8px 16px; border-radius: 6px; margin-bottom: 20px;
  }
  h1 { font-size: 22px; margin: 0 0 8px; font-weight: 600; }
  .subtitle { font-size: 14px; color: #5f5f5f; margin: 0 0 24px; line-height: 1.5; }
  .info-box {
    background: #fbe6e8; border-left: 3px solid #c8202c;
    padding: 12px 14px; border-radius: 4px; margin-bottom: 20px;
    text-align: left;
  }
  .info-box-title {
    font-size: 12px; font-weight: 600; color: #c8202c;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
  }
  .info-box-text { font-size: 13px; line-height: 1.5; }
  .login-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px;
    background: #c8202c; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600;
    text-decoration: none; cursor: pointer; min-height: 48px;
    transition: background 0.15s;
  }
  .login-btn:hover { background: #a81a24; }
  .login-btn:active { transform: scale(0.98); }
  .countdown {
    margin-top: 12px; font-size: 12px; color: #909090;
    min-height: 18px;
  }
  .footer {
    margin-top: 18px; font-size: 11px; color: #909090; line-height: 1.6;
  }
  .domain-hint {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: #5f5f5f; background: #f5f5f5;
    padding: 2px 6px; border-radius: 4px; font-size: 11px;
  }
  .spin {
    width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>

<main class="gate">
  <span class="brand-mark">EMAPI</span>
  <h1>Repartos</h1>
  <p class="subtitle">Sistema interno de gestión de despachos y entregas</p>

  <div class="info-box">
    <div class="info-box-title">Acceso restringido</div>
    <div class="info-box-text">Requiere cuenta corporativa <span class="domain-hint">@emapi.com.ar</span></div>
  </div>

  <a id="loginBtn" class="login-btn" href="#">
    <span id="btnLabel">Iniciar sesión</span>
  </a>
  <p class="countdown" id="countdown"></p>

  <p class="footer">
    Si tenés problemas para acceder, contactá a<br>
    <span class="domain-hint">soporte@emapi.com.ar</span>
  </p>
</main>

<script>
  // ⚙️  CONFIG — paste your Apps Script web app URL here (the full long one)
  var APPS_SCRIPT_URL = 'https://script.google.com/a/macros/emapisa.com.ar/s/AKfycbxWECM40qcWTbQpwgxzeB_91pJVqH5Myl43FENvnYxV1tj7NYynRHgaiK3Ly05S2Oac/exec';

  // Auto-redirect after this many seconds; set to 0 to disable
  var AUTO_REDIRECT_SECONDS = 2;
  // ─────────────────────────────────────────────────────────────────────

  var btn = document.getElementById('loginBtn');
  var btnLabel = document.getElementById('btnLabel');
  var countdownEl = document.getElementById('countdown');

  btn.href = APPS_SCRIPT_URL;
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    redirect();
  });

  function redirect() {
    btnLabel.innerHTML = '<span class="spin"></span> Redirigiendo...';
    btn.style.pointerEvents = 'none';
    window.location.href = APPS_SCRIPT_URL;
  }

  if (AUTO_REDIRECT_SECONDS > 0) {
    var remaining = AUTO_REDIRECT_SECONDS;
    countdownEl.textContent = 'Redirigiendo en ' + remaining + 's...';
    var timer = setInterval(function() {
      remaining--;
      if (remaining <= 0) {
        clearInterval(timer);
        redirect();
      } else {
        countdownEl.textContent = 'Redirigiendo en ' + remaining + 's...';
      }
    }, 1000);

    // Cancel auto-redirect if user clicks anything else on the page
    document.addEventListener('mousemove', function() { /* keep going */ }, { once: true });
  }
</script>

</body>
</html>
